plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.80'
}

version = mod_version
group = mod_group

base {
    archivesName = 'AIBuildAssistantNF'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    // Built against Forge 47 (runs on Forge and NeoForge 1.20.1). CI also checks NeoForge with -Pplatform=neoforge.
    if (findProperty('platform') == 'neoforge') {
        enable {
            neoForgeVersion = "${minecraft_version}-${neoforge_version}"
        }
    } else {
        version = "${minecraft_version}-${forge_version}"
    }

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // CI: opens a world, equips AI gear, takes screenshots and quits (client/SmokeTest.java).
        smokeClient {
            client()
            systemProperty 'aib.smoketest', 'true'
            gameDirectory = project.file('run/smoke')
        }
        // Server-side game tests (in-world checks). Run with ./gradlew runGameTestServer
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Unit tests load Minecraft's registries (block names, block states) without starting a game.
    addModdingDependenciesTo sourceSets.test
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Groovy runs the AI's build scripts. Bundled inside the mod jar (Jar-in-Jar).
    jarJar(implementation("org.codehaus.groovy:groovy")) {
        version { strictly "[${groovy_version},3.1)"; prefer groovy_version }
    }
    jarJar(implementation("org.codehaus.groovy:groovy-json")) {
        version { strictly "[${groovy_version},3.1)"; prefer groovy_version }
    }
    // Forge 1.20.1 does not put plain libraries on the game's classpath in dev runs by itself.
    additionalRuntimeClasspath "org.codehaus.groovy:groovy:${groovy_version}"
    additionalRuntimeClasspath "org.codehaus.groovy:groovy-json:${groovy_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors,
        minecraft_version: minecraft_version, forge_version: forge_version
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '3000']
}

jar {
    from('LICENSE') { rename { "${it}_AIBuildAssistantNF" } }
    manifest {
        attributes(
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'MixinConfigs': "${mod_id}.mixins.json"
        )
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
