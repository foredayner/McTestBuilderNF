name: build

on:
  push:
    branches-ignore: [ci-logs, ci-logs-neoforge, ci-logs-1.21.1, migrated-src]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: NeoForge 1.21.1 (build, tests, client screenshots)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Server game tests
        id: gametest
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew runGameTestServer 2>&1 | tee gametest.log

      - name: Client smoke test (screenshots)
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runSmokeClient > smoke.log 2>&1
          grep -q "\[smoketest\] done" run/smoke/logs/latest.log

      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/neoforge-1.21.1' && steps.gametest.outcome == 'success' && steps.smoke.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mc1.21.1-neoforge-latest
          name: AI Build Assistant NF for Minecraft 1.21.1 NeoForge (latest build)
          prerelease: true
          make_latest: false
          body: |
            Minecraft 1.21.1 NeoForge port of Minecraft-AI-Build-Assistant (original: Fyzugx-Lab, CC0),
            via the 1.21.4 Fabric version (foredayner/McTestBuilder).
            Built automatically from `${{ github.sha }}` after unit tests, in-game server tests and a client smoke test passed.
            See PORT-1.21.1.md for what changed and how to install.
          files: |
            build/libs/AIBuildAssistantNF-*.jar
            !build/libs/*-sources.jar

      - name: Publish logs to the ci-logs branch
        if: always()
        run: |
          out=$(mktemp -d)
          cp build.log gametest.log smoke.log "$out/" 2>/dev/null || true
          cp -r build/test-results "$out/" 2>/dev/null || true
          cp -r run/logs "$out/gametest-logs" 2>/dev/null || true
          cp -r run/crash-reports "$out/" 2>/dev/null || true
          cp -r run/smoke/screenshots "$out/screenshots" 2>/dev/null || true
          cp run/smoke/logs/latest.log "$out/smoke-latest.log" 2>/dev/null || true
          cp -r run/smoke/crash-reports "$out/smoke-crash-reports" 2>/dev/null || true
          cp build/libs/*.jar "$out/" 2>/dev/null || true
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} build=${{ steps.build.outcome }} gametest=${{ steps.gametest.outcome }} smoke=${{ steps.smoke.outcome }}" > "$out/RUN.txt"
          cd "$out"
          git init -q && git checkout -q -b ci-logs-1.21.1 && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "logs for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-1.21.1
