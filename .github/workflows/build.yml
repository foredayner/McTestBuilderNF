name: build

on:
  push:
    branches-ignore: [ci-logs, migrated-src]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Server game tests
        id: gametest
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          ./gradlew runGameTestServer 2>&1 | tee gametest.log

      - name: Publish logs to the ci-logs branch
        if: always()
        run: |
          out=$(mktemp -d)
          cp build.log gametest.log "$out/" 2>/dev/null || true
          cp -r build/test-results "$out/" 2>/dev/null || true
          cp -r runs/gameTestServer/logs "$out/gametest-logs" 2>/dev/null || true
          cp -r runs/gameTestServer/crash-reports "$out/" 2>/dev/null || true
          cp build/libs/*.jar "$out/" 2>/dev/null || true
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} build=${{ steps.build.outcome }} gametest=${{ steps.gametest.outcome }}" > "$out/RUN.txt"
          cd "$out"
          git init -q && git checkout -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "logs for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
