plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.120'
}

version = mod_version
group = mod_group

base {
    archivesName = 'AIBuildAssistantNF'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // CI: opens a world, equips AI gear, takes screenshots and quits (client/SmokeTest.java).
        smokeClient {
            client()
            systemProperty 'aib.smoketest', 'true'
            gameDirectory = project.file('run/smoke')
        }
        // Server-side game tests (in-world checks). Run with ./gradlew runGameTestServer
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // Unit tests run inside NeoForge's test loader, so Minecraft's registries are ready.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Groovy runs the AI's build scripts. Bundled inside the mod jar (Jar-in-Jar).
    jarJar(implementation("org.codehaus.groovy:groovy")) {
        version { strictly "[${groovy_version},3.1)"; prefer groovy_version }
    }
    jarJar(implementation("org.codehaus.groovy:groovy-json")) {
        version { strictly "[${groovy_version},3.1)"; prefer groovy_version }
    }
    // Plain libraries are not on the game's class path in dev runs by themselves.
    additionalRuntimeClasspath "org.codehaus.groovy:groovy:${groovy_version}"
    additionalRuntimeClasspath "org.codehaus.groovy:groovy-json:${groovy_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_authors: mod_authors,
        minecraft_version: minecraft_version, neoforge_version: neoforge_version
    ]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '3000']
}

jar {
    from('LICENSE') { rename { "${it}_AIBuildAssistantNF" } }
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
